<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SariHub — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <link rel="stylesheet" href="tokens.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: #DCD7CB; font-family: 'Inter', sans-serif; }
    body { min-height: 100vh; }
    @keyframes fadeIn  { from { opacity: 0; }                              to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes pop     { from { opacity: 0; transform: scale(0.94); }       to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="ops-data.jsx"></script>
  <script type="text/babel" src="ops-frames.jsx"></script>
  <script type="text/babel" src="admin-screens.jsx"></script>

  <script type="text/babel">
    const AdminPage = () => {
      const [adminTab, setAdminTab] = React.useState('dispatch');
      return (
        <PageShell>
          <PageHeader
            eyebrow="SariHub · Ops prototype"
            title="Distributor admin"
            sub="Manage today's prices, dispatch board, and route load balancing."
            right={<RoleNav current="admin"/>}
          />
          <div style={{ maxWidth: 1480, margin: '0 auto' }}>
            <DesktopWindow>
              <AdminShell adminTab={adminTab} setAdminTab={setAdminTab}>
                {adminTab === 'dispatch' ? <AdminDispatch/> : <AdminPrices/>}
              </AdminShell>
            </DesktopWindow>
          </div>
        </PageShell>
      );
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<AdminPage/>);
  </script>
</body>
</html>
